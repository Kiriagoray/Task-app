<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up with Google</title>
    <!-- Use Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="mt-5 text-center">
            <h3>You are about to sign in using a third-party account from Google</h3>
            <p>To continue, please click the button below:</p>
            <a href="{% provider_login_url 'google' %}" class="btn btn-danger">Continue with Google</a>
        </div>
    </div>
</body>
</html>
